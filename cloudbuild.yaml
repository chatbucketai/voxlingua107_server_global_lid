steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run/voxlingua107:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run/voxlingua107:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'voxlingua107'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run/voxlingua107:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '4'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--port'
      - '8000'
      - '--allow-unauthenticated'
      - '--timeout'
      - '300'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run/voxlingua107:$COMMIT_SHA'
